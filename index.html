<title>DO MATCHA | دو ماتشا</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{
  --matcha-900:#242e14;
  --matcha-700:#49592a;
  --matcha-500:#7c9049;
  --matcha-300:#aec077;
  --matcha-100:#dfe9b8;
  --cream:#faf5e7;
  --cream-deep:#efe6d0;
  --ink:#6c1019;
  --ink-deep:#45090e;
  --gold:#b9902c;
  --gold-soft:#e7d49c;
  --shadow:#171d0d;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100%;color:var(--ink);
  font-family:'Tajawal',Tahoma,Arial,sans-serif;
  direction:rtl;
  display:grid;place-items:center;
  padding-inline:16px;padding-block:32px;
  background-color:var(--matcha-900);
  background-image:radial-gradient(circle at 20% -8%,var(--matcha-300) 0%,transparent 48%),
    linear-gradient(160deg,var(--matcha-700) 0%,var(--matcha-900) 72%);
}
h1,h2{text-wrap:balance}

.page{width:min(100%,430px);position:relative;isolation:isolate}

.hero{text-align:center;color:var(--cream);position:relative;z-index:2;padding:4px 6px 0}
.eyebrow{margin:0;font-size:11px;letter-spacing:4px;color:var(--gold-soft);direction:ltr;text-transform:uppercase}
.brand{margin:10px 0 0;font:600 34px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:3px;direction:ltr;color:var(--cream)}
.jp{margin:4px 0 0;font-size:13px;letter-spacing:5px;opacity:.85}
.hint{margin:12px 0 0;font-size:12.5px;opacity:.9}

.stage{height:188px;position:relative;z-index:2;display:grid;place-items:center}
.steam{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:70px;height:48px;pointer-events:none;opacity:.55}
.steam path{fill:none;stroke:var(--gold-soft);stroke-width:1.6;stroke-linecap:round}
.bowl-btn{border:0;background:transparent;width:180px;height:160px;position:relative;cursor:pointer;border-radius:50%;padding:0}
.bowl{position:absolute;left:14px;top:29px;width:150px;height:112px;border-radius:12px 12px 76px 76px;background:var(--cream-deep);border:3px solid var(--ink-deep);box-shadow:0 14px 24px var(--shadow)}
.tea{position:absolute;left:18px;top:10px;width:108px;height:47px;border-radius:50%;background:radial-gradient(circle at 46% 42%,var(--matcha-100) 0 5%,var(--matcha-500) 7% 28%,var(--matcha-700) 50%,#3c4a20 72%);border:3px solid #5b3a24;overflow:hidden}
.tea:after{content:"";position:absolute;inset:8px;border:2px solid #f6f2d680;border-radius:50%;transform:rotate(-12deg)}
.whisk{position:absolute;z-index:4;left:101px;top:3px;width:12px;height:106px;background:linear-gradient(90deg,var(--gold),var(--gold-soft),var(--gold));border-radius:8px;transform:rotate(24deg);transform-origin:50% 90%}
.mix .whisk{animation:whisk .2s linear 6 alternate}
.mix .tea{animation:swirl .45s linear 3}
@keyframes whisk{to{transform:rotate(3deg)}}
@keyframes swirl{50%{filter:brightness(1.2);transform:scale(.96) rotate(8deg)}}
.particle{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--matcha-100);pointer-events:none;animation:pop .75s ease-out forwards}
@keyframes pop{to{transform:translate(var(--x),var(--y)) scale(.1);opacity:0}}

.card{position:relative;z-index:3;background:var(--cream);border-radius:44px 44px 28px 28px;padding:30px 20px 0;text-align:center;box-shadow:0 24px 50px -16px var(--shadow)}
.seal{width:82px;height:82px;margin:-62px auto 14px;background:var(--cream);border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;box-shadow:0 6px 14px #00000022}
.star{width:60px;height:60px;background:var(--ink);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);display:grid;place-items:center;color:var(--cream);font:600 8px/1.25 'Cormorant Garamond',Georgia,serif;letter-spacing:.5px;direction:ltr;text-align:center}
.card-title{font:500 29px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:2px;margin:0;direction:ltr;color:var(--ink-deep)}
.tag{font-size:14px;margin:9px 0 21px;color:var(--ink)}

.links{display:grid;gap:11px}
.link{min-height:64px;border:1.5px solid var(--ink);border-radius:999px;text-decoration:none;color:var(--ink);display:grid;grid-template-columns:46px 1fr 24px;align-items:center;gap:4px;padding:6px 14px;background:#fffdf8;transition:transform .2s,box-shadow .2s,background .2s;box-shadow:0 5px 12px #4b1f1614}
.link:active{transform:scale(.975);background:var(--cream-deep)}
@media(hover:hover){.link:hover{transform:translateY(-2px);box-shadow:0 10px 20px #4b1f1624}}
.ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--cream-deep);color:var(--ink)}
.ico svg{width:20px;height:20px}
.label{display:grid;text-align:right;gap:2px;min-width:0}
.main{font-weight:700;font-size:15px}
.sub{font-size:12px;color:var(--ink);opacity:.72;direction:ltr;text-align:right}
.arrow{font-size:22px;color:var(--gold);line-height:1}

.status{height:24px;font-size:12px;margin:14px 0 2px;color:var(--gold);letter-spacing:.5px}
.footer{margin:0 -20px;height:58px;background:var(--ink);border-radius:50% 50% 28px 28px/36% 36% 28px 28px;color:var(--cream);display:flex;justify-content:center;align-items:center;gap:8px;font:500 11px 'Tajawal',sans-serif;letter-spacing:3px;direction:ltr}

button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:12px}

@media(prefers-reduced-motion:no-preference){
  .hero{opacity:0;animation:rise .7s .05s ease forwards}
  .card{opacity:0;animation:rise .7s .18s ease forwards}
  .steam path{animation:drift 4s ease-in-out infinite}
  .steam path:nth-child(2){animation-delay:.6s}
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes drift{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:.7;transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hero,.card{opacity:1}}
@media(max-width:360px){body{padding-inline:10px}.card{padding-left:14px;padding-right:14px}}
</style>

<script>
const bowl=document.getElementById("bowl"),stage=document.getElementById("stage"),status=document.getElementById("status");
let busy=false;
bowl.addEventListener("click",()=>{
  if(busy)return;busy=true;
  bowl.classList.add("mix");
  status.textContent="نخفق الماتشا... ✦";
  for(let i=0;i<14;i++){
    const p=document.createElement("i");
    p.className="particle";
    p.style.left=(48+Math.random()*45)+"%";
    p.style.top=(38+Math.random()*25)+"%";
    p.style.setProperty("--x",((Math.random()-.5)*155)+"px");
    p.style.setProperty("--y",(-35-Math.random()*85)+"px");
    stage.appendChild(p);
    setTimeout(()=>p.remove(),800);
  }
  setTimeout(()=>{
    bowl.classList.remove("mix");
    status.textContent="ماتشا جاهزة ♡";
    busy=false;
  },1250);
});
</script>
